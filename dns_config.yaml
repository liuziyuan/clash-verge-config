# Clash Verge DNS Config
#
# 注意:本文件只有在 Verge 设置里勾选「使用自定义 DNS」后才会生效。
# 当前默认的 DNS 由 Verge 内核托管,本文件的配置不会参与解析。

dns:
  enable: true
  ipv6: true
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: false
  use-hosts: false
  use-system-hosts: false
  fake-ip-filter:
  # ===== 客户 VPN 内网域名:强制返回真实 IP,禁止 fake-ip 接管 =====
  # Ivanti 下发的内网地址是公网段(143.x/137.x/155.x/192.44.x 等),
  # 系统路由已把这些段指向 utun5。一旦域名被 fake-ip 改写成 198.18.x.x,
  # 流量就会绕进 Clash 的 TUN,内网访问时通时不通。
  - '+.cn-pgcloud.com'
  - '+.pg.com.cn'
  - '+.cn-x-cloud-pg.com.cn'
  - '+.cn-xnp-cloud-pg.com.cn'
  - '+.pg.com'
  # ===== 默认例外 =====
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  default-nameserver:
  - system
  - 223.6.6.6
  - 8.8.8.8
  - 2400:3200::1
  - 2001:4860:4860::8888
  nameserver:
  - 8.8.8.8
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback: []
  # ===== 内网域名固定交给客户 VPN 的 DNS 解析 =====
  # 192.44.212.206 / 192.44.120.10 由 Ivanti 下发,系统路由指向 utun5。
  # 实测:仅 VPN 已连接时可达;未连接时这些域名解析失败,属于预期行为
  # (内网域名本来就只有连上 VPN 才能用,宁可明确失败也不要落到公共 DNS 拿错 IP)。
  # 注意不要改成 system:实测 mihomo 直接向这两个地址查询是通的,
  # 系统解析器反而可能被全局 DNS 覆盖,行为更不可控。
  nameserver-policy:
    '+.cn-pgcloud.com':
    - 192.44.212.206
    - 192.44.120.10
    '+.pg.com.cn':
    - 192.44.212.206
    - 192.44.120.10
    '+.cn-x-cloud-pg.com.cn':
    - 192.44.212.206
    - 192.44.120.10
    '+.cn-xnp-cloud-pg.com.cn':
    - 192.44.212.206
    - 192.44.120.10
    # 注意:vpn.pg.com 不能绑定 VPN DNS——它是 VPN 网关域名,
    # 连接前必须先靠公网 DNS 解析(实测公网返回的 155.124.244.54 与 VPN 内部一致),
    # 绑定内部 DNS 会造成"连 VPN 前解析不了网关"的死锁。
  proxy-server-nameserver: []
  direct-nameserver: []
  direct-nameserver-follow-policy: false
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
hosts: {}
