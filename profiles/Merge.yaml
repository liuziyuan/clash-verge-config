# Profile Enhancement Merge Template for Clash Verge
# 黑名单分流模式:基于 Loyalsoldier/clash-rules(https://github.com/Loyalsoldier/clash-rules)
# 国内/Apple 直连,被墙网站(GFWList+proxy)走 PROXY,漏网流量直连兜底(MATCH,DIRECT)

profile:
  store-selected: true

# PROXY 统一选择组在订阅专属「编辑代理组」覆写(g121H3lCtYp4.yaml)中以
# prepend 方式追加 —— 全局 Merge 的 prepend-proxy-groups 键在 verge 2.5.7
# 不生效,会被当作未知顶层键透传进 runtime,故不在此定义。

# 规则集:jsDelivr CDN,经 PROXY 组拉取,每 24h 自动更新
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/loyalsoldier/reject.yaml
    interval: 86400
    proxy: PROXY
  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/loyalsoldier/private.yaml
    interval: 86400
    proxy: PROXY
  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/loyalsoldier/applications.yaml
    interval: 86400
    proxy: PROXY
  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/loyalsoldier/icloud.yaml
    interval: 86400
    proxy: PROXY
  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/loyalsoldier/apple.yaml
    interval: 86400
    proxy: PROXY
  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/loyalsoldier/google.yaml
    interval: 86400
    proxy: PROXY
  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/loyalsoldier/gfw.yaml
    interval: 86400
    proxy: PROXY
  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/loyalsoldier/proxy.yaml
    interval: 86400
    proxy: PROXY
  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/loyalsoldier/direct.yaml
    interval: 86400
    proxy: PROXY
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/loyalsoldier/lancidr.yaml
    interval: 86400
    proxy: PROXY
  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/loyalsoldier/cncidr.yaml
    interval: 86400
    proxy: PROXY
  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/loyalsoldier/telegramcidr.yaml
    interval: 86400
    proxy: PROXY

# 黑名单规则链:整体替换订阅自带规则
rules:
  # ===== P&G 客户内网/公司域名直连(置于链首,优先于一切 RULE-SET) =====
  # Ivanti VPN 内网系统:浏览器经系统代理 bypass 直连(见 verge.yaml system_proxy_bypass);
  # 此处 DIRECT 保证任何入口都不把这些域名送进 PROXY(内网 IP 经代理节点不可达,
  # 且 vpn.pg.com 网关流量绕道代理有被风控踢线的风险)
  - DOMAIN-SUFFIX,cn-pgcloud.com,DIRECT
  - DOMAIN-SUFFIX,pg.com.cn,DIRECT
  - DOMAIN-SUFFIX,cn-x-cloud-pg.com.cn,DIRECT
  - DOMAIN-SUFFIX,cn-xnp-cloud-pg.com.cn,DIRECT
  - DOMAIN-SUFFIX,pg.com,DIRECT
  # ===== Microsoft Teams 直连(置于链首,优先于所有 RULE-SET) =====
  # 进程级:Teams 主进程及 WebView Helper 全家族,无论目标域名一律直连
  - PROCESS-PATH-REGEX,(?i)/Applications/Microsoft Teams\.app,DIRECT
  - PROCESS-NAME,Microsoft Teams,DIRECT
  # 域名级:浏览器网页版 Teams 直连(进程规则覆盖不到浏览器)
  - DOMAIN-SUFFIX,teams.microsoft.com,DIRECT
  - DOMAIN-SUFFIX,teams.live.com,DIRECT
  - DOMAIN-SUFFIX,svc.ms,DIRECT
  # ===== 原有黑名单规则链 =====
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,google,PROXY
  - RULE-SET,gfw,PROXY
  - RULE-SET,proxy,PROXY
  - RULE-SET,direct,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,cncidr,DIRECT
  - RULE-SET,telegramcidr,PROXY
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
